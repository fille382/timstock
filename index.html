<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fakturering">
<title>Fakturering</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='32' y='45' font-size='38' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>F</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar no-print">
  <h1 class="topbar-title" id="topbar-title">Tidrapport</h1>
  <div class="topbar-actions" id="topbar-actions"></div>
</header>

<main id="main" class="no-print"></main>

<nav class="bottomnav no-print" id="tabs">
  <button class="tab" data-view="time" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Tid</span>
  </button>
  <button class="tab" data-view="clients" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M17.5 19a5.4 5.4 0 0 0-2-4.2"/></svg>
    <span>Kunder</span>
  </button>
  <button class="tab" data-view="invoices" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
    <span>Fakturor</span>
  </button>
  <button class="tab" data-view="settings" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3"/></svg>
    <span>Inställningar</span>
  </button>
</nav>

<!-- Fakturan renderas hit och är det enda som syns vid utskrift -->
<div id="print-area"></div>

<div id="sheet" class="sheet no-print" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-close-sheet aria-label="Stäng">&times;</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast no-print" hidden></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/view-time.js"></script>
<script src="js/view-clients.js"></script>
<script src="js/view-invoices.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
